[project]
name = "docxray"
version = "0.1.0"
description = "ReadOnly python-docx fork lib"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "types-lxml>=2026.2.16",
]

[tool.pyright]
root = ['src']

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
py_version = 313
profile = "black"
line_length = 79
force_single_line = false
force_sort_within_sections = false
from_first = false
order_by_type = true
no_sections = false
import_heading_firstparty = "docxray stuff"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"

[tool.mypy]
strict = true
strict_bytes = true
python_version = "3.13"
namespace_packages = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
install_types = true
