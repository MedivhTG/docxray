[project]
name = "docxray"
version = "0.1.0"
description = "ReadOnly lib"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.0",
    "pillow>=12.2.0",
    "wand>=0.7.0",
]

[dependency-groups]
dev = [
    "black==24.*",
    "coverage==7.*",
    "mypy==1.*",
    "ruff==0.*",
    "isort==5.*",
    "types-lxml>=2026.2.16",
]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
py_version = 312
profile = "black"
line_length = 79
force_single_line = false
force_sort_within_sections = false
from_first = false
order_by_type = true
no_sections = false
import_heading_firstparty = "docxray stuff"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"

[tool.pyright]
root = ['src']

[tool.mypy]
strict = true
strict_bytes = true
python_version = "3.13"
namespace_packages = true
ignore_missing_imports = true
disable_error_code = ["misc", "type-arg"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = false
show_error_codes = true
warn_unused_ignores = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
install_types = true
